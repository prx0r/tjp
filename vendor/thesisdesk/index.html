<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThesisDesk</title><link rel="stylesheet" href="app.css"></head>
<body><header><div><div class="brand">THESISDESK</div><div class="sub">Five trades. Explicit theses. Explicit falsification.</div></div><button class="primary" onclick="addTrade()">+ Trade</button></header>
<div class="shell"><aside id="tabs"></aside><main id="content"></main></div>
<div class="modal" id="logModal"><div class="modalbox"><h3>Log thesis update</h3><p class="sub">Record what changed. Do not rewrite history.</p><textarea id="logText" rows="5" placeholder="What happened? What evidence changed?"></textarea><div class="row" style="margin-top:10px"><div><label class="sub">Conviction</label><input id="logConv" type="number" min="0" max="10"></div><div><label class="sub">Action</label><select id="logAction"><option>HOLD</option><option>ADD</option><option>TRIM</option><option>EXIT</option><option>WATCH</option></select></div></div><div class="toolbar" style="justify-content:flex-end"><button onclick="document.querySelector('#logModal').classList.remove('show')">Cancel</button><button class="primary" onclick="saveLog()">Save update</button></div></div></div>
<script src="app.js"></script></body></html>
