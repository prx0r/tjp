[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postagi-kernel"
version = "0.1.0"
description = "World-state divergence and technological-obsolescence research kernel"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "networkx>=3.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
full = ["requests>=2.31", "sentence-transformers>=3.0", "keybert>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
postagi-demo = "postagi_kernel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["postagi_kernel*"]
